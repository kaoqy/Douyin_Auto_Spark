<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>抖音续火花管理面板</title>
  <link rel="stylesheet" href="/style.css?v=1.0.0" />
  <script>!function(){try{const t=localStorage.getItem('das-theme')||'system';document.documentElement.dataset.theme=t}catch(e){}}()</script>
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">🔥</div>
        <div class="brand-text">
          <strong>抖音续火花</strong>
          <span>管理面板</span>
        </div>
      </div>
      <nav>
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-ico">📊</span>仪表盘
        </button>
        <button class="nav-item" data-view="accounts">
          <span class="nav-ico">👥</span>账号管理
        </button>
        <button class="nav-item" data-view="friends">
          <span class="nav-ico">💬</span>好友管理
        </button>
        <button class="nav-item" data-view="yiyan">
          <span class="nav-ico">📝</span>一言库
        </button>
        <button class="nav-item" data-view="logs">
          <span class="nav-ico">📜</span>续火日志
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-ico">⚙️</span>设置
        </button>
      </nav>
      <div class="side-foot">
        <label class="theme-control">
          外观
          <select id="theme">
            <option value="system">跟随系统</option>
            <option value="light">白天</option>
            <option value="dark">黑夜</option>
          </select>
        </label>
        <div class="ver" id="app-version">…</div>
      </div>
    </aside>

    <!-- 主内容 -->
    <main class="main">
      <header class="topbar">
        <h1 id="view-title">仪表盘</h1>
        <div class="topbar-actions">
          <button class="btn btn-ghost" id="btn-health" title="服务状态">●</button>
          <button class="btn btn-ghost" id="btn-user" title="账户">👤</button>
          <button class="btn btn-primary" id="btn-run">▶ 立即续火</button>
        </div>
      </header>

      <!-- 仪表盘 -->
      <section class="view" id="view-dashboard">
        <div class="stat-grid" id="statGrid"></div>
        <div class="sched-strip" id="schedStrip" hidden>
          <span class="sched-icon">⏰</span>
          <span class="sched-text" id="schedText">—</span>
          <span class="sched-countdown" id="schedCountdown"></span>
        </div>
        <div class="dash-row">
          <div class="card trend-card">
            <div class="card-head"><h2>近 7 天续火趋势</h2><span class="hint" id="trendHint"></span></div>
            <div class="trend" id="trendChart"></div>
          </div>
          <div class="card quote-card">
            <div class="card-head"><h2>每日一言</h2><button class="btn btn-ghost btn-sm" id="btn-quote-refresh" title="换一句">🔄</button></div>
            <blockquote class="quote" id="quoteBox">载入中…</blockquote>
            <div class="quote-from" id="quoteFrom"></div>
            <div class="form-actions"><button class="btn btn-ghost btn-sm" id="btn-quote-push">📮 推送到 TG</button></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h2>最近任务</h2></div>
          <div class="table-wrap"><table id="recentTasks"><thead><tr><th>任务ID</th><th>触发</th><th>状态</th><th>开始</th><th>结束</th></tr></thead><tbody></tbody></table></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>账号状态</h2><button class="btn btn-ghost btn-sm" id="btn-refresh-acc">刷新</button></div>
          <div class="table-wrap"><table id="dashAccounts"><thead><tr><th>账号</th><th>状态</th><th>上次续火</th><th>说明</th></tr></thead><tbody></tbody></table></div>
        </div>
      </section>

      <!-- 账号管理 -->
      <section class="view" id="view-accounts" hidden>
        <div class="card">
          <div class="card-head">
            <h2>账号列表</h2>
            <div class="account-actions">
              <div class="account-action-group account-action-primary">
                <button class="btn btn-primary btn-sm" id="btn-add-acc">＋ 添加账号</button>
                <button class="btn btn-primary btn-sm" id="btn-spark-selected" disabled>✔ 勾选续火</button>
              </div>
            </div>
          </div>
          <div class="batch-bar" id="batchBar" hidden>
            <span class="hint">已选 <b id="selCount">0</b> 个账号</span>
            <button class="btn btn-ghost btn-sm" id="btn-sel-enable">启用选中</button>
            <button class="btn btn-ghost btn-sm" id="btn-sel-disable">停用选中</button>
            <button class="btn btn-ghost btn-sm" id="btn-sel-clear">清空选择</button>
          </div>
          <div class="table-wrap"><table id="accTable"><thead><tr><th style="width:34px"><input type="checkbox" id="accCheckAll" title="全选" /></th><th>名称</th><th>状态</th><th>代理</th><th>上次续火</th><th>操作</th></tr></thead><tbody></tbody></table></div>
        </div>
      </section>

      <!-- 好友管理 -->
      <section class="view" id="view-friends" hidden>
        <div class="card">
          <div class="card-head">
            <h2>续火好友</h2>
            <div class="account-actions">
              <select id="friends-account-select" class="log-filter" style="width:auto"></select>
              <button class="btn btn-primary btn-sm" id="btn-add-friend">＋ 添加好友</button>
            </div>
          </div>
          <div class="table-wrap"><table id="friendsTable"><thead><tr><th>好友名称</th><th>状态</th><th>上次续火</th><th>操作</th></tr></thead><tbody></tbody></table></div>
        </div>
      </section>

      <!-- 一言库 -->
      <section class="view" id="view-yiyan" hidden>
        <div class="card">
          <div class="card-head">
            <h2>一言库</h2>
            <div class="account-actions">
              <button class="btn btn-primary btn-sm" id="btn-add-yiyan">＋ 添加一言</button>
              <button class="btn btn-ghost btn-sm" id="btn-import-yiyan">导入默认</button>
              <button class="btn btn-ghost btn-sm" id="btn-random-yiyan">🎲 随机一条</button>
            </div>
          </div>
          <div id="random-yiyan-result" class="card" style="display:none;"></div>
          <div class="table-wrap"><table id="yiyanTable"><thead><tr><th>内容</th><th>出处</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table></div>
        </div>
      </section>

      <!-- 日志 -->
      <section class="view" id="view-logs" hidden>
        <div class="card">
          <div class="card-head">
            <h2>续火日志</h2>
            <div class="log-tools">
              <input class="log-search" id="logSearch" placeholder="🔍 搜索账号/消息" />
              <select id="logFilter" class="log-filter">
                <option value="">全部状态</option>
                <option value="success">仅成功</option>
                <option value="partial">仅部分</option>
                <option value="failed">仅失败</option>
              </select>
              <button class="btn btn-ghost btn-sm" id="btn-refresh-logs">刷新</button>
              <button class="btn btn-danger btn-sm" id="btn-clear-logs">清空</button>
            </div>
          </div>
          <div class="log-list" id="logList"></div>
          <div class="hint" id="logCount" style="margin-top:10px"></div>
        </div>
      </section>

      <!-- 设置 -->
      <section class="view" id="view-settings" hidden>
        <div class="settings-grid">
          <div class="card">
            <div class="card-head"><h2>Telegram 通知</h2></div>
            <div class="form">
              <label>启用 TG 推送<input type="checkbox" id="s-tg_enabled" /></label>
              <label>Bot Token <input id="s-tg_bot_token" placeholder="123456:ABC-DEF..." autocomplete="off" /></label>
              <label>Chat / User ID <input id="s-tg_user_id" placeholder="987654321" /></label>
              <label>附带每日一言<input type="checkbox" id="s-tg_quote_enabled" /></label>
              <label>仅异常时推送<input type="checkbox" id="s-tg_only_on_change" /></label>
              <label>静默推送（不提示音）<input type="checkbox" id="s-tg_silent" /></label>
              <div class="form-actions">
                <button class="btn btn-ghost" id="btn-test-tg">测试推送</button>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h2>定时续火</h2></div>
            <div class="form">
              <label>启用定时<input type="checkbox" id="s-schedule_enabled" /></label>
              <label>Cron 表达式 <input id="s-schedule_cron" placeholder="0 8 * * *" /><small>默认每天 8:00</small></label>
              <div class="form-actions"><button class="btn btn-ghost" id="btn-save-schedule">保存</button></div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h2>消息模板</h2></div>
            <div class="form">
              <label>自定义模板（<code>[API]</code> = 每日一言）
                <textarea id="s-message_template" rows="4" placeholder="{{friend}}，今天的火花到账啦🔥\n{{yiyan}}\n——「{{from}}」\n{{date}} {{weekday}}"></textarea>
              </label>
              <label>一言出处
                <select id="s-yiyan_include_source">
                  <option value="1">显示出处</option>
                  <option value="0">不显示出处</option>
                </select>
              </label>
              <div class="form-actions"><button class="btn btn-ghost" id="btn-save-template">保存</button></div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h2>日志保留</h2></div>
            <div class="form">
              <label>保留天数<input type="number" id="s-log_retention_days" min="0" value="30" /><small>0 = 不自动清理</small></label>
              <div class="form-actions"><button class="btn btn-ghost" id="btn-save-retention">保存</button></div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h2>账户</h2></div>
            <div class="form">
              <div class="row2">
                <label>原密码<input type="password" id="p-old" autocomplete="off" /></label>
                <label>新密码<input type="password" id="p-new" autocomplete="off" /></label>
              </div>
              <div class="form-actions">
                <button class="btn btn-ghost" id="btn-change-pwd">修改密码</button>
                <button class="btn btn-danger" id="btn-logout">退出登录</button>
              </div>
              <small class="hint" id="pwd-status"></small>
            </div>
          </div>
        </div>
        <div class="card settings-save">
          <button class="btn btn-primary" id="btn-save-all">💾 保存全部设置</button>
          <span class="save-status" id="saveStatus"></span>
        </div>
      </section>
    </main>
  </div>

  <!-- 弹窗：账号编辑 -->
  <div class="modal-mask" id="accModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2 id="accModalTitle">添加账号</h2>
        <button class="modal-close" id="accModalClose">×</button>
      </div>
      <div class="modal-body">
        <div class="form">
          <label>账号名称<input id="m-name" placeholder="例如：小号1" /></label>
          <label>Cookie JSON（从 Cookie-Editor 导出）<textarea id="m-cookie" rows="6" placeholder='[{"name":"sessionid","value":"...","domain":".douyin.com"}]'></textarea></label>
          <label>SOCKS5 代理（可选）<input id="m-proxy" placeholder="socks5://user:pass@host:port" /></label>
          <label class="inline"><input type="checkbox" id="m-enabled" checked /> 启用自动续火</label>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="accModalCancel">取消</button>
        <button class="btn btn-primary" id="accModalSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 弹窗：好友编辑 -->
  <div class="modal-mask" id="friendModal" hidden>
    <div class="modal modal-sm">
      <div class="modal-head"><h2>添加好友</h2><button class="modal-close" id="friendModalClose">×</button></div>
      <div class="modal-body">
        <div class="form">
          <label>好友名称（建议用抖音备注名）<input id="m-friend-name" placeholder="输入昵称" /></label>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="friendModalCancel">取消</button>
        <button class="btn btn-primary" id="friendModalSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 弹窗：一言编辑 -->
  <div class="modal-mask" id="yiyanModal" hidden>
    <div class="modal modal-sm">
      <div class="modal-head"><h2>添加一言</h2><button class="modal-close" id="yiyanModalClose">×</button></div>
      <div class="modal-body">
        <div class="form">
          <label>内容<textarea id="m-yiyan-text" rows="3" placeholder="输入一言内容"></textarea></label>
          <label>出处<input id="m-yiyan-source" placeholder="如：火影忍者" /></label>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="yiyanModalCancel">取消</button>
        <button class="btn btn-primary" id="yiyanModalSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 弹窗：手动运行状态 -->
  <div class="modal-mask" id="runModal" hidden>
    <div class="modal modal-sm">
      <div class="modal-head"><h2>续火运行中</h2><button class="modal-close" id="runModalClose">×</button></div>
      <div class="modal-body">
        <div class="run-progress"><div class="run-bar" id="runBar"></div></div>
        <div class="run-info" id="runInfo">准备中…</div>
        <div class="run-lines" id="runLines"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/app.js?v=1.0.0"></script>
</body>
</html>
