<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始化 - 抖音续火花管理面板</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-left">
                <h1>🔥 抖音续火花</h1>
            </div>
        </header>

        <div class="container">
            <div class="login-container">
                <div class="login-box">
                    <h2>🚀 首次使用</h2>
                    <p class="login-subtitle">创建管理员账号开始使用</p>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="init-username" value="admin" placeholder="管理员用户名">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="init-password" placeholder="至少 6 位">
                    </div>
                    <div class="form-group">
                        <label>确认密码</label>
                        <input type="password" id="init-password2" placeholder="再次输入密码">
                    </div>
                    <button class="btn btn-primary btn-block" onclick="doInit()">创建管理员</button>
                    <p id="init-error" class="error-msg"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="toast"></div>

    <script>
        function $(sel) { return document.querySelector(sel); }

        function showToast(msg, type = 'info') {
            const toast = $('#toast');
            toast.textContent = msg;
            toast.className = `toast toast-${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function api(path, opts = {}) {
            const res = await fetch(path, {
                headers: { 'Content-Type': 'application/json' },
                ...opts,
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.detail || `请求失败 (${res.status})`);
            }
            return data;
        }

        async function doInit() {
            const username = $('#init-username').value.trim();
            const password = $('#init-password').value;
            const password2 = $('#init-password2').value;
            
            if (!username) return $('#init-error').textContent = '请输入用户名';
            if (password.length < 6) return $('#init-error').textContent = '密码至少 6 位';
            if (password !== password2) return $('#init-error').textContent = '两次密码不一致';
            
            try {
                await api('/api/auth/init', {
                    method: 'POST',
                    body: JSON.stringify({ username, password }),
                });
                window.location.href = '/';
            } catch (e) {
                $('#init-error').textContent = e.message;
            }
        }

        // 回车提交
        $('#init-password2').addEventListener('keypress', e => {
            if (e.key === 'Enter') doInit();
        });
    </script>
</body>
</html>
