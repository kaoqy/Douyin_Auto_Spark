<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 抖音续火花管理面板</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-left">
                <h1>🔥 抖音续火花</h1>
            </div>
        </header>

        <div class="container">
            <div class="login-container">
                <div class="login-box">
                    <h2>登录</h2>
                    <p class="login-subtitle">抖音续火花管理面板</p>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
                    </div>
                    <button class="btn btn-primary btn-block" onclick="doLogin()">登录</button>
                    <p id="login-error" class="error-msg"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="toast"></div>

    <script>
        function $(sel) { return document.querySelector(sel); }

        function showToast(msg, type = 'info') {
            const toast = $('#toast');
            toast.textContent = msg;
            toast.className = `toast toast-${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function api(path, opts = {}) {
            const res = await fetch(path, {
                headers: { 'Content-Type': 'application/json' },
                ...opts,
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.detail || `请求失败 (${res.status})`);
            }
            return data;
        }

        async function doLogin() {
            const username = $('#login-username').value.trim();
            const password = $('#login-password').value;
            if (!username || !password) {
                $('#login-error').textContent = '请输入用户名和密码';
                return;
            }
            try {
                await api('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password }),
                });
                window.location.href = '/';
            } catch (e) {
                $('#login-error').textContent = e.message;
            }
        }

        // 回车登录
        $('#login-password').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });

        // 检查是否已登录
        api('/api/auth/me').then(() => {
            window.location.href = '/';
        }).catch(() => {});
    </script>
</body>
</html>
